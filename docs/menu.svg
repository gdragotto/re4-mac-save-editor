      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="20" y="14" width="820" height="526" rx="12" fill="#151515"/>
    <rect x="20" y="14" width="820" height="34" rx="12" fill="#2a2a2a"/>
    <rect x="20" y="36" width="820" height="12" fill="#2a2a2a"/>
    <circle cx="44" cy="31" r="6.5" fill="#ff5f57"/>
    <circle cx="66" cy="31" r="6.5" fill="#febc2e"/>
